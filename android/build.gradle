buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34 // ⛔ Use 34, not 35 — RN 0.76 is not fully ready for 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125" // ✅ Recommended for RN 0.76
        kotlinVersion = "1.9.24"

        // AndroidX and Jetifier
        useAndroidX = true
        enableJetifier = true
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

// ✅ Required workaround to avoid caching issues in native builds
tasks.whenTaskAdded { task ->
    if (task.name.contains("externalNativeBuildDebug") ||
        task.name.contains("externalNativeBuildRelease")) {
        task.doNotTrackState()
    }
}

// ✅ Required for React Native Gradle plugin to hook in
apply plugin: "com.facebook.react.rootproject"
