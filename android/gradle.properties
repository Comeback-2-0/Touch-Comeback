# React Native build settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin build settings
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Reanimated workaround for CMake/native build issues
REANIMATED_DISABLE_CMAKE_BUILD=1

# Enable Hermes only if you're using it
hermesEnabled=true

# Disable New Architecture (causes native build errors if not fully set up)
newArchEnabled=false


